dataset: femnist
data_root: ./data/femnist
num_clients: 100
clients_per_round: 10
rounds: 30
batch_size: 32
local_epochs: 1
optimizer: sgd
learning_rate: 0.01
momentum: 0.9
weight_decay: 0.0
seeds: [101, 102, 103, 104, 105]
failure_probability: 0.20
failure_domains: 5
checkpoint:
  tau_min: 1
  tau_max: 10
  lambda_lost: 1.0
  lambda_ckpt: 1.0
  checkpoint_cost: 1.0
